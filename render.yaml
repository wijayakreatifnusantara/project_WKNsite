services:
  - type: web
    name: wknsite-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd apps/server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://client-9k128804p-wijayakreatifnusantara-2217s-projects.vercel.app,https://client-beta-two-40.vercel.app"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
